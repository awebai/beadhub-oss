{{ define "main" }}
<div class="docs-page">
  <div class="container docs-container docs-shell">
    {{ partial "docs_sidebar.html" . }}
    <article class="docs-article">
      <div class="docs-header">
        <div class="docs-header-main">
          <p class="docs-kicker">BeadHub Docs</p>
          <h1 class="docs-title">{{ .Title }}</h1>
        </div>
        <div class="llms-badge">
          <a href="{{ .RelPermalink }}llms.txt" class="llms-badge-link">llms.txt</a>
          <button type="button" class="llms-badge-copy" data-llms-url="{{ .RelPermalink }}llms.txt" aria-label="Copy llms.txt content to clipboard" title="Copy to clipboard">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>
      </div>
      {{ with .Description }}<p class="docs-description">{{ . }}</p>{{ end }}
      <div class="docs-body">
        {{ .Content }}
      </div>
      {{ with .Lastmod }}
        <p class="docs-note">Last updated: {{ .Format "January 2, 2006" }}</p>
      {{ end }}
    </article>
  </div>
</div>
{{ end }}
